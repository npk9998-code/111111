<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عقارات">
<meta name="theme-color" content="#080d14">
<link rel="manifest" href="manifest.json">
<title>عقارات — بيع وطلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   DESIGN SYSTEM
   Dark navy base · Gold sellers · Teal buyers · Purple match
══════════════════════════════════════════ */
:root{
  /* Base */
  --bg:#080d14; --surf:#0e1825; --surf2:#060b11;
  --border:rgba(255,255,255,.06); --text:#e8f0fe; --muted:#6b8aaa; --dim:#344d66;

  /* Sellers — warm gold */
  --sell:#f5a623; --sell-d:#c4841a; --sell-glow:rgba(245,166,35,.2);

  /* Buyers — cool teal */
  --buy:#06b6d4; --buy-d:#0e7490; --buy-glow:rgba(6,182,212,.2);

  /* Match — electric violet */
  --match:#a855f7; --match-d:#7c3aed; --match-glow:rgba(168,85,247,.2);

  /* Directions — same as before */
  --n-bg:#fff1f2;--n-bd:#fca5a5;--n-b:#ef4444;--n-t:#991b1b;
  --s-bg:#fefce8;--s-bd:#fde047;--s-b:#ca8a04;--s-t:#713f12;
  --e-bg:#eff6ff;--e-bd:#93c5fd;--e-b:#2563eb;--e-t:#1e3a8a;
  --w-bg:#f0fdf4;--w-bd:#86efac;--w-b:#16a34a;--w-t:#14532d;

  /* Priority */
  --urg:#ef4444; --nor:#06b6d4; --flex:#22c55e;

  /* Safe areas */
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100%}
input,select,textarea{font-size:16px!important;font-family:'Tajawal',sans-serif}

/* ── Responsive shell ── */
@media(max-width:639px){
  body{position:fixed;inset:0;overflow:hidden}
  #app{height:100%;overflow:hidden}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
}
@media(min-width:640px){
  body{padding:calc(var(--st)+16px) 16px calc(var(--sb)+16px);background:#03060a}
  #app{border-radius:24px;overflow:hidden;box-shadow:0 32px 100px rgba(0,0,0,.8)}
  .scroll{overflow-y:auto;max-height:calc(100vh - 265px)}
}
#app{display:flex;flex-direction:column;width:100%;max-width:700px;margin:0 auto;background:var(--bg)}

/* ══ HEADER ══ */
.hdr{
  padding:calc(var(--st)+14px) 16px 0;
  flex-shrink:0;
  background:linear-gradient(180deg,#0d1a2e 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
}
.hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdr-logo{
  width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(135deg,#1e3a5f,#0d1a2e);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  flex-shrink:0;
}
.hdr-title{font-size:17px;font-weight:900;color:var(--text);line-height:1.1}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}

/* ── Mode switcher (عروض / طلبات) in header ── */
.mode-sw{display:flex;gap:0;background:var(--surf2);border-radius:10px;padding:3px;border:1px solid var(--border)}
.msw{flex:1;padding:6px 10px;border:none;border-radius:8px;font-size:12px;font-weight:800;font-family:'Tajawal',sans-serif;cursor:pointer;transition:all .18s;color:var(--muted);background:transparent;touch-action:manipulation}
.msw.on-sell{background:var(--sell);color:#fff;box-shadow:0 2px 8px var(--sell-glow)}
.msw.on-buy{background:var(--buy);color:#fff;box-shadow:0 2px 8px var(--buy-glow)}

/* ── Stats bar ── */
.stats-wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 0 11px;scrollbar-width:none}
.stats-wrap::-webkit-scrollbar{display:none}
.dstat{flex:0 0 auto;border-radius:9px;padding:6px 13px;text-align:center;border:1px solid;min-width:58px;cursor:pointer;transition:transform .13s}
.dstat:active{transform:scale(.93)}
.dstat.on{outline:2px solid #fff4;outline-offset:1px}
.dstat-n{font-size:19px;font-weight:900;line-height:1}
.dstat-l{font-size:10px;color:var(--muted);margin-top:1px}
.pstat{flex:0 0 auto;border-radius:9px;padding:6px 11px;text-align:center;border:1px solid;min-width:52px;cursor:pointer;transition:transform .13s}
.pstat:active{transform:scale(.93)}
.pstat.on{outline:2px solid #fff4;outline-offset:1px}

/* ══ SCROLL ══ */
.scroll{flex:1;overscroll-behavior:contain;padding:12px 13px 8px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ══ TAB BAR ══ */
.tabs{display:flex;background:var(--surf2);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--sb)}
.tab{flex:1;padding:9px 0 7px;border:none;background:transparent;color:var(--dim);font-size:10.5px;font-family:'Tajawal',sans-serif;cursor:pointer;font-weight:700;border-top:2.5px solid transparent;transition:all .18s;touch-action:manipulation;user-select:none}
.tab.on-sell{color:var(--sell);border-top-color:var(--sell)}
.tab.on-buy{color:var(--buy);border-top-color:var(--buy)}
.tab.on-match{color:var(--match);border-top-color:var(--match)}
.tab.on-stats{color:#94a3b8;border-top-color:#94a3b8}
.tab-ic{font-size:18px;display:block;margin-bottom:2px}

/* ══ INPUTS ══ */
.inp{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid #1a2d42;background:var(--surf2);color:var(--text);-webkit-appearance:none;outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus{border-color:var(--active-color,var(--sell));box-shadow:0 0 0 3px var(--active-glow,var(--sell-glow))}
textarea.inp{resize:vertical}
.lbl{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600}
.field{margin-bottom:13px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}

/* ══ BUTTONS ══ */
.btn{border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;user-select:none;touch-action:manipulation;width:100%;display:block}
.btn:active{transform:scale(.96)}
.b-sell{background:linear-gradient(135deg,var(--sell),var(--sell-d));color:#fff;box-shadow:0 4px 16px var(--sell-glow)}
.b-buy{background:linear-gradient(135deg,var(--buy),var(--buy-d));color:#fff;box-shadow:0 4px 16px var(--buy-glow)}
.b-match{background:linear-gradient(135deg,var(--match),var(--match-d));color:#fff;box-shadow:0 4px 16px var(--match-glow)}
.b-red{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff}
.b-ghost{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.b-green{background:linear-gradient(135deg,#059669,#065f46);color:#fff}
.b-blue{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff}
.b-purple{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff}
.b-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-block}

/* ══ CHIPS & TAGS ══ */
.chip{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:800;color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800}

/* ══ DIRECTION BUTTONS ══ */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtn{border-radius:11px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;touch-action:manipulation;border-width:2px;border-style:solid}
.dbtn:active{transform:scale(.95)}

/* ══ TYPE / PRIORITY BUTTONS ══ */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tbtn{border-radius:11px;padding:10px 4px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;touch-action:manipulation;border:2px solid #1a2d42;background:rgba(255,255,255,.03);color:var(--muted)}
.tbtn.on-sell{border-color:var(--sell);background:rgba(245,166,35,.12);color:var(--sell)}
.tbtn.on-buy{border-color:var(--buy);background:rgba(6,182,212,.12);color:var(--buy)}
.tbtn:active{transform:scale(.95)}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pbtn{border-radius:11px;padding:10px 4px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;touch-action:manipulation;border:2px solid #1a2d42;background:rgba(255,255,255,.03);color:var(--muted);text-align:center}
.pbtn.urg.on{border-color:var(--urg);background:rgba(239,68,68,.13);color:var(--urg)}
.pbtn.nor.on{border-color:var(--buy);background:rgba(6,182,212,.13);color:var(--buy)}
.pbtn.flex.on{border-color:var(--flex);background:rgba(34,197,94,.13);color:var(--flex)}

/* ══ FILTER PILLS ══ */
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fpill{flex:0 0 auto;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid #1a2d42;background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-family:'Tajawal',sans-serif;touch-action:manipulation;transition:all .15s}
.fpill:active{transform:scale(.94)}
.fpill.on-sell{background:rgba(245,166,35,.14);border-color:var(--sell);color:var(--sell)}
.fpill.on-buy{background:rgba(6,182,212,.14);border-color:var(--buy);color:var(--buy)}

/* ══ CARDS ══ */
.card{border-radius:14px;padding:13px 14px;margin-bottom:9px;border-width:1.5px;border-style:solid;cursor:pointer;transition:transform .13s,filter .13s;user-select:none;touch-action:manipulation;position:relative;overflow:hidden}
.card:active{transform:scale(.985);filter:brightness(.86)}
.card-accent{position:absolute;top:0;right:0;width:4px;height:100%}

/* ══ MATCH CARD ══ */
.mcard{border-radius:16px;padding:14px;margin-bottom:11px;background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(124,58,237,.04));border:1.5px solid rgba(168,85,247,.25);cursor:pointer;transition:transform .13s;user-select:none;touch-action:manipulation}
.mcard:active{transform:scale(.985)}
.mcard-score{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-size:15px;font-weight:900;flex-shrink:0;border:2px solid}
.match-row{display:grid;grid-template-columns:1fr 20px 1fr;gap:8px;align-items:start;margin-top:10px}
.match-side{border-radius:10px;padding:9px 10px;font-size:12px}
.match-arrow{font-size:18px;text-align:center;padding-top:6px;color:var(--match)}
.match-fields{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mf-tag{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;background:rgba(168,85,247,.15);color:var(--match)}

/* ══ OVERLAYS ══ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fIn .2s}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surf);border-radius:22px 22px 0 0;width:100%;max-width:700px;padding:22px 18px;padding-bottom:calc(22px + var(--sb));max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;animation:sUp .22s ease}
.sheet::-webkit-scrollbar{display:none}
@keyframes sUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ══ TOAST ══ */
.toast{position:fixed;top:calc(var(--st)+14px);left:50%;transform:translateX(-50%);z-index:999;color:#fff;padding:10px 22px;border-radius:12px;font-weight:800;font-size:13px;font-family:'Tajawal',sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.6);white-space:nowrap;max-width:92vw;animation:tIn .22s ease;pointer-events:none}
@keyframes tIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ══ DETAIL ══ */
.det-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.det-k{color:var(--dim);font-size:13px;flex-shrink:0;width:120px}
.det-v{color:var(--text);font-size:13px;font-weight:700;text-align:left;word-break:break-all;flex:1}
.act-row{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.act-row .btn{flex:1;min-width:80px}

/* ══ SEARCH ROW ══ */
.srow{display:flex;gap:8px;margin-bottom:10px}
.swrap{flex:1;position:relative}
.sic{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none}
.sinp{padding-right:36px}
.icobtn{padding:0 11px;font-size:13px;width:auto;min-width:40px;display:flex;align-items:center;justify-content:center}

/* ══ ACTIVE FILTER TAGS ══ */
.afilters{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.aftag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;cursor:pointer}
.afx{font-size:13px;line-height:1}

/* ══ EMPTY ══ */
.empty{text-align:center;padding:55px 20px}
.e-ic{font-size:52px;margin-bottom:12px}
.e-t{font-size:15px;font-weight:800;color:var(--muted)}
.e-s{color:var(--dim);font-size:12px;margin-top:6px}

/* ══ SECTION TITLE ══ */
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:var(--text);margin-bottom:16px}
.form-note{text-align:center;color:var(--dim);font-size:11px;margin-top:14px}

/* ══ SCORE RING ══ */
.score-high{background:rgba(168,85,247,.15);border-color:var(--match);color:var(--match)}
.score-mid{background:rgba(6,182,212,.12);border-color:var(--buy);color:var(--buy)}
.score-low{background:rgba(245,166,35,.12);border-color:var(--sell);color:var(--sell)}

/* ══ INSTALL BANNER ══ */
.ibanner{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:11px 14px;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.ibanner-x{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px;line-height:1}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo">🏘️</div>
      <div style="flex:1;min-width:0">
        <div class="hdr-title">عقارات — بيع وطلب</div>
        <div class="hdr-sub">
          <span class="sdot" id="sdot"></span>
          <span id="stxt" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">جاري التحميل...</span>
        </div>
      </div>
      <!-- Mode switcher shown only on list/form tabs -->
      <div class="mode-sw" id="modeSw" style="display:none">
        <button class="msw" id="mswSell" onclick="setMode('sell')">🏠 بيع</button>
        <button class="msw" id="mswBuy" onclick="setMode('buy')">🔑 طلب</button>
      </div>
    </div>
    <div class="stats-wrap" id="statsRow"></div>
  </div>

  <div class="scroll" id="scroll"></div>

  <!-- TAB BAR (5 tabs: sell-list, sell-add, buy-list, buy-add, match, stats) -->
  <div class="tabs">
    <button class="tab" id="tList"  onclick="goTab('list')"><span class="tab-ic" id="tListIc">📋</span><span id="tListLbl">عروض</span></button>
    <button class="tab" id="tAdd"   onclick="goTab('add')"><span class="tab-ic">➕</span>إضافة</button>
    <button class="tab" id="tMatch" onclick="goTab('match')"><span class="tab-ic">🤝</span>تطابق</button>
    <button class="tab" id="tStats" onclick="goTab('stats')"><span class="tab-ic">📊</span>إحصائيات</button>
  </div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<!-- DELETE OVERLAY -->
<div class="overlay" id="delOverlay" style="display:none" onclick="closeOv('delOverlay')">
  <div class="sheet" onclick="event.stopPropagation()" style="text-align:center">
    <div style="font-size:46px;margin-bottom:8px">🗑️</div>
    <div style="font-size:16px;font-weight:900;margin-bottom:5px" id="delTitle">حذف؟</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:22px">لا يمكن التراجع عن هذا الإجراء</div>
    <div style="display:flex;gap:9px">
      <button class="btn b-red" onclick="confirmDel()">نعم، احذف</button>
      <button class="btn b-ghost" onclick="closeOv('delOverlay')">إلغاء</button>
    </div>
  </div>
</div>

<!-- DETAIL OVERLAY -->
<div class="overlay" id="detOverlay" style="display:none" onclick="closeOv('detOverlay')">
  <div class="sheet" id="detSheet" onclick="event.stopPropagation()"></div>
</div>

<!-- MATCH DETAIL OVERLAY -->
<div class="overlay" id="mdetOverlay" style="display:none" onclick="closeOv('mdetOverlay')">
  <div class="sheet" id="mdetSheet" onclick="event.stopPropagation()"></div>
</div>

<!-- IMPORT OVERLAY -->
<div class="overlay" id="importOverlay" style="display:none" onclick="closeOv('importOverlay')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div style="font-size:15px;font-weight:900;margin-bottom:6px">📥 استيراد ودمج بيانات</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:16px;line-height:1.6">
      اختر ملف JSON صادر من هذا التطبيق أو نسخة سابقة منه.
    </div>
    <label style="display:block;background:rgba(255,255,255,.03);border:2px dashed rgba(255,255,255,.1);border-radius:14px;padding:22px;text-align:center;cursor:pointer;margin-bottom:14px">
      <div style="font-size:32px;margin-bottom:6px">📂</div>
      <div style="font-weight:800;font-size:13px" id="importLbl">اضغط لاختيار ملف JSON</div>
      <input type="file" accept=".json" style="display:none" onchange="doImport(this)">
    </label>
    <button class="btn b-ghost" onclick="closeOv('importOverlay')">إلغاء</button>
  </div>
</div>

<script>
'use strict';
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const DC={
  'شمال':{bg:'#fff1f2',bd:'#fca5a5',b:'#ef4444',t:'#991b1b'},
  'جنوب':{bg:'#fefce8',bd:'#fde047',b:'#ca8a04',t:'#713f12'},
  'شرق': {bg:'#eff6ff',bd:'#93c5fd',b:'#2563eb',t:'#1e3a8a'},
  'غرب': {bg:'#f0fdf4',bd:'#86efac',b:'#16a34a',t:'#14532d'},
};
const DIRS=['شمال','جنوب','شرق','غرب'];
const TYPES=['أرض','فيلا','عمارة','شقة','محل'];
const PRIOS=[{id:'عاجل',ic:'🔴',col:'#ef4444'},{id:'عادي',ic:'🔵',col:'#06b6d4'},{id:'مرن',ic:'🟢',col:'#22c55e'}];

const SKEY='unified_sells_v1';
const BKEY='unified_buys_v1';
const IKEY='unified_install';

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let sells=[], buys=[];
let mode='sell';          // 'sell' | 'buy'
let tab='list';           // 'list' | 'add' | 'match' | 'stats'
let editId=null, delId=null, delKind=null;
let search='', filterDirs=[], filterTypes=[], filterPrios=[];
let showBanner=false;
let toastT=null;

const ES=()=>({direction:'',sellerName:'',sellerPhone:'',neighborhood:'',propertyType:'',area:'',streetWidth:'',price:'',notes:''});
const EB=()=>({direction:'',buyerName:'',buyerPhone:'',neighborhood:'',propertyType:'',areaMin:'',areaMax:'',budgetMin:'',budgetMax:'',priority:'عادي',notes:''});
let form=ES();

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function init(){
  try{sells=JSON.parse(localStorage.getItem(SKEY)||'[]');}catch(e){sells=[];}
  try{buys=JSON.parse(localStorage.getItem(BKEY)||'[]');}catch(e){buys=[];}
  showBanner=!localStorage.getItem(IKEY)&&!window.matchMedia('(display-mode:standalone)').matches;
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  window.addEventListener('beforeinstallprompt',e=>{window._dip=e;e.preventDefault();});
}
function saveAll(){
  try{localStorage.setItem(SKEY,JSON.stringify(sells));}catch(e){}
  try{localStorage.setItem(BKEY,JSON.stringify(buys));}catch(e){}
  render();
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg,type='ok'){
  clearTimeout(toastT);
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  el.style.background=type==='err'?'#dc2626':type==='info'?'#1d4ed8':type==='match'?'#7c3aed':'#0e7490';
  toastT=setTimeout(()=>el.style.display='none',3200);
}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
function setMode(m){
  if(tab===1) syncDOM();
  mode=m;
  if(tab==='add'){form=m==='sell'?ES():EB(); editId=null;}
  filterDirs=[]; filterTypes=[]; filterPrios=[]; search='';
  render();
}

function goTab(t){
  if(tab==='add') syncDOM();
  tab=t;
  if(t!=='add'&&editId){editId=null; form=mode==='sell'?ES():EB();}
  render();
}

function closeOv(id){document.getElementById(id).style.display='none';}

// ══════════════════════════════════════════
// DOM SYNC (prevent data loss on re-render)
// ══════════════════════════════════════════
function syncDOM(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:null;};
  if(mode==='sell'){
    ['sellerName','sellerPhone','neighborhood','area','streetWidth','price','notes'].forEach(k=>{
      const v=g('f_'+k); if(v!==null) form[k]=v;
    });
  } else {
    ['buyerName','buyerPhone','neighborhood','areaMin','areaMax','budgetMin','budgetMax','notes'].forEach(k=>{
      const v=g('f_'+k); if(v!==null) form[k]=v;
    });
  }
}

// ══════════════════════════════════════════
// FILTERS
// ══════════════════════════════════════════
function togDir(d){const i=filterDirs.indexOf(d);i>=0?filterDirs.splice(i,1):filterDirs.push(d);if(tab!=='list')goTab('list');else render();}
function togType(t){const i=filterTypes.indexOf(t);i>=0?filterTypes.splice(i,1):filterTypes.push(t);render();}
function togPrio(p){const i=filterPrios.indexOf(p);i>=0?filterPrios.splice(i,1):filterPrios.push(p);render();}
function clearF(){filterDirs=[];filterTypes=[];filterPrios=[];render();}

function getList(){return mode==='sell'?sells:buys;}
function filtered(){
  let res=getList();
  if(search.trim()){const q=search.trim();res=res.filter(r=>[r.sellerName,r.buyerName,r.sellerPhone,r.buyerPhone,r.direction,r.propertyType,r.neighborhood,r.priority].some(v=>v&&v.includes(q)));}
  if(filterDirs.length)  res=res.filter(r=>filterDirs.includes(r.direction));
  if(filterTypes.length) res=res.filter(r=>filterTypes.includes(r.propertyType));
  if(filterPrios.length) res=res.filter(r=>filterPrios.includes(r.priority));
  return res;
}

// ══════════════════════════════════════════
// MATCH ENGINE
// ══════════════════════════════════════════
function computeMatches(){
  const results=[];
  sells.forEach(s=>{
    buys.forEach(b=>{
      let score=0; const matched=[];
      // Direction match (30pts)
      if(s.direction&&b.direction&&s.direction===b.direction){score+=30;matched.push('الاتجاه');}
      // Type match (25pts)
      if(s.propertyType&&b.propertyType&&s.propertyType===b.propertyType){score+=25;matched.push('النوع');}
      // Neighborhood match (20pts)
      if(s.neighborhood&&b.neighborhood&&s.neighborhood.trim()===b.neighborhood.trim()){score+=20;matched.push('الحي');}
      // Price/budget match (20pts)
      if(s.price&&(b.budgetMin||b.budgetMax)){
        const sp=num(s.price), bMin=num(b.budgetMin||'0'), bMax=num(b.budgetMax||'999999999');
        if(sp>=bMin&&sp<=bMax){score+=20;matched.push('الميزانية');}
        else if(bMin>0&&sp<=bMax*1.15&&sp>=bMin*.85){score+=8;} // close
      }
      // Area match (5pts)
      if(s.area&&(b.areaMin||b.areaMax)){
        const sa=num(s.area), aMin=num(b.areaMin||'0'), aMax=num(b.areaMax||'999999');
        if(sa>=aMin&&sa<=aMax){score+=5;matched.push('المساحة');}
      }
      if(score>=25) results.push({s,b,score,matched});
    });
  });
  results.sort((a,b)=>b.score-a.score);
  return results;
}

// ══════════════════════════════════════════
// RENDER — MASTER
// ══════════════════════════════════════════
function render(){
  // Header sub-text
  const total=sells.length+buys.length;
  document.getElementById('stxt').textContent=sells.length+' عرض · '+buys.length+' طلب';

  // Mode switcher visibility
  const showSw=(tab==='list'||tab==='add');
  const msw=document.getElementById('modeSw');
  msw.style.display=showSw?'flex':'none';
  document.getElementById('mswSell').className='msw'+(mode==='sell'?' on-sell':'');
  document.getElementById('mswBuy').className='msw'+(mode==='buy'?' on-buy':'');

  // Stats bar
  renderStatBar();

  // Active color CSS vars
  const root=document.documentElement;
  const ac=mode==='sell'?'var(--sell)':mode==='buy'?'var(--buy)':'var(--match)';
  const ag=mode==='sell'?'var(--sell-glow)':mode==='buy'?'var(--buy-glow)':'var(--match-glow)';
  root.style.setProperty('--active-color',ac);
  root.style.setProperty('--active-glow',ag);

  // Tab bar
  ['List','Add','Match','Stats'].forEach(t=>{
    const el=document.getElementById('t'+t);
    const tid=t.toLowerCase();
    el.className='tab';
    if(tid===tab){
      if(tid==='match') el.classList.add('on-match');
      else if(tid==='stats') el.classList.add('on-stats');
      else el.classList.add(mode==='sell'?'on-sell':'on-buy');
    }
  });
  // list tab label
  document.getElementById('tListIc').textContent=mode==='sell'?'📋':'🔑';
  document.getElementById('tListLbl').textContent=mode==='sell'?'عروض':'طلبات';

  // Content
  const sc=document.getElementById('scroll');
  if(tab==='list')       sc.innerHTML=renderList();
  else if(tab==='add')   sc.innerHTML=renderForm();
  else if(tab==='match') sc.innerHTML=renderMatch();
  else                   sc.innerHTML=renderStats();
}

// ── Stat bar ──────────────────────────────
function renderStatBar(){
  const list=getList();
  let h=DIRS.map(d=>{
    const c=DC[d], n=list.filter(r=>r.direction===d).length;
    const on=filterDirs.includes(d);
    return '<div class="dstat'+(on?' on':'')+'" style="background:'+c.b+'18;border-color:'+c.bd+'" onclick="togDir(\''+d+'\')">'
      +'<div class="dstat-n" style="color:'+c.b+'">'+n+'</div>'
      +'<div class="dstat-l">'+d+(on?' ✓':'')+'</div></div>';
  }).join('');
  if(mode==='buy'){
    PRIOS.forEach(p=>{
      const n=buys.filter(r=>r.priority===p.id).length, on=filterPrios.includes(p.id);
      h+='<div class="pstat'+(on?' on':'')+'" style="background:'+p.col+'16;border-color:'+p.col+'40" onclick="togPrio(\''+p.id+'\')">'
        +'<div class="dstat-n" style="color:'+p.col+'">'+n+'</div>'
        +'<div class="dstat-l">'+p.id+(on?' ✓':'')+'</div></div>';
    });
  }
  if(tab==='match'){
    const mn=computeMatches().length;
    h='<div class="dstat on" style="background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.4)">'
      +'<div class="dstat-n" style="color:var(--match)">'+mn+'</div>'
      +'<div class="dstat-l">تطابق</div></div>'
      +'<div class="dstat" style="background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3)">'
      +'<div class="dstat-n" style="color:var(--sell)">'+sells.length+'</div>'
      +'<div class="dstat-l">عروض</div></div>'
      +'<div class="dstat" style="background:rgba(6,182,212,.1);border-color:rgba(6,182,212,.3)">'
      +'<div class="dstat-n" style="color:var(--buy)">'+buys.length+'</div>'
      +'<div class="dstat-l">طلبات</div></div>';
  }
  document.getElementById('statsRow').innerHTML=h;
}

// LIST TAB

function renderList(){
  const isSell=mode==='sell';
  const fil=filtered();
  const acOn=isSell?'on-sell':'on-buy';
  let h='';

  if(showBanner){
    h+='<div class="ibanner"><div style="font-size:26px">📲</div>'
      +'<div style="flex:1;font-size:12px;color:var(--muted);line-height:1.4">'
      +'<div style="font-weight:800;color:var(--text);margin-bottom:2px">أضف للشاشة الرئيسية</div>'
      +'Safari ← مشاركة ↑ ← إضافة إلى الشاشة الرئيسية</div>'
      +'<button class="ibanner-x" onclick="dimBanner()">✕</button></div>';
  }

  // Search + actions
  h+='<div class="srow">'
    +'<div class="swrap"><span class="sic">🔍</span>'
    +'<input id="searchInp" class="inp sinp" type="search" placeholder="بحث..." value="'+x(search)+'" oninput="onSearch(this.value)" autocomplete="off" spellcheck="false"></div>'
    +'<button class="btn b-green icobtn" onclick="exportJSON()" title="تصدير">📤</button>'
    +'<button class="btn b-blue icobtn" onclick="openImport()" title="استيراد">📥</button>'
    +'</div>';

  // Active filter tags
  const anyF=filterDirs.length||filterTypes.length||filterPrios.length;
  if(anyF){
    h+='<div class="afilters">';
    filterDirs.forEach(d=>{const c=DC[d];h+='<span class="aftag" style="background:'+c.b+'20;border:1px solid '+c.b+'55;color:'+c.b+'">'+d+' <span class="afx" onclick="togDir(\''+d+'\')">✕</span></span>';});
    filterTypes.forEach(t=>{h+='<span class="aftag" style="background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted)">'+t+' <span class="afx" onclick="togType(\''+t+'\')">✕</span></span>';});
    filterPrios.forEach(p=>{const pr=PRIOS.find(z=>z.id===p)||PRIOS[1];h+='<span class="aftag" style="background:'+pr.col+'18;border:1px solid '+pr.col+'44;color:'+pr.col+'">'+p+' <span class="afx" onclick="togPrio(\''+p+'\')">✕</span></span>';});
    h+='<span style="color:var(--dim);font-size:11px;cursor:pointer;text-decoration:underline" onclick="clearF()">مسح</span></div>';
  }

  // Type filter pills
  h+='<div class="filter-row"><span class="fpill'+(filterTypes.length===0?' '+acOn:'')+'" onclick="filterTypes=[];render()">الكل</span>';
  TYPES.forEach(t=>{
    const n=getList().filter(r=>r.propertyType===t).length;
    h+='<span class="fpill'+(filterTypes.includes(t)?' '+acOn:'')+'" onclick="togType(\''+t+'\')">'+t+(n?' ('+n+')':'')+'</span>';
  });
  h+='</div>';

  if(!fil.length){
    h+='<div class="empty"><div class="e-ic">'+(search||anyF?'🔍':isSell?'🏠':'🔑')+'</div>'
      +'<div class="e-t">'+(search||anyF?'لا نتائج':isSell?'لا توجد عروض بعد':'لا توجد طلبات بعد')+'</div>'
      +(!search&&!anyF?'<div class="e-s">اضغط «إضافة» لتسجيل '+(isSell?'أول عرض':'أول طلب')+'</div>':'')+'</div>';
  } else {
    fil.forEach((r,i)=>{
      const c=DC[r.direction]||{bg:'#0e1825',bd:'#1a2d42',b:'#334d66',t:var_text()};
      if(isSell){
        h+=sellCard(r,c,i);
      } else {
        h+=buyCard(r,c,i);
      }
    });
  }
  return h;
}

    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">'
    +'<div style="display:flex;gap:5px;flex-wrap:wrap">'
    +(r.direction?'<span class="chip" style="background:'+c.b+'">'+r.direction+'</span>':'')
    +(r.propertyType?'<span class="tag" style="color:'+c.t+';background:'+c.b+'22">'+r.propertyType+'</span>':'')
    +'</div><span style="color:#6b8aaa;font-size:10px">#'+(i+1)+'</span></div>'
    +'<div style="color:'+c.t+';font-size:15px;font-weight:900;margin-bottom:3px">'+x(r.sellerName||'—')+'</div>'

    +(editId?'<button class="btn b-ghost" style="margin-top:9px" onclick="cancelEdit()">إلغاء</button>':'')
    +'<div class="form-note">💾 البيانات محفوظة محلياً — تعمل بدون إنترنت</div></div>';
  return h;
}

// ══════════════════════════════════════════
// MATCH TAB
// ══════════════════════════════════════════
function renderMatch(){
  const matches=computeMatches();
  if(!sells.length&&!buys.length){
    return '<div class="empty"><div class="e-ic">🤝</div><div class="e-t">لا توجد بيانات بعد</div><div class="e-s">أضف عروضاً وطلبات لتظهر التطابقات</div></div>';
  }
  if(!matches.length){
    return '<div class="empty"><div class="e-ic">🔍</div><div class="e-t">لا توجد تطابقات حالياً</div><div class="e-s">التطابق يحتاج تشابه في الاتجاه أو النوع أو الميزانية</div></div>';
  }

  let h='<div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">'
    +'<div style="font-size:13px;font-weight:800;color:var(--muted)">'+matches.length+' تطابق محتمل</div>'
    +'<div style="font-size:11px;color:var(--dim)">مرتبة من الأعلى توافقاً</div></div>';

  matches.forEach((m,idx)=>{
    const s=m.s, b=m.b;
    const sc=m.score;
    const cls=sc>=70?'score-high':sc>=45?'score-mid':'score-low';
    const cs=DC[s.direction]||{b:'#334d66',t:'#e8f0fe',bg:'#0e1825',bd:'#1a2d42'};
    const cb=DC[b.direction]||{b:'#06b6d4',t:'#e8f0fe',bg:'#060b11',bd:'#1a2d42'};

    h+='<div class="mcard" onclick="openMatchDetail('+idx+')">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div class="mcard-score '+cls+'">'+sc+'</div>'
      +'<div style="flex:1">'
      +'<div style="font-size:13px;font-weight:900;color:var(--match);margin-bottom:3px">'
      +m.matched.map(f=>'<span class="mf-tag">'+f+'</span>').join(' ')+' متطابق</div>'
      +'<div style="font-size:11px;color:var(--dim)">اضغط للتفاصيل والمشاركة</div>'
      +'</div></div>'
      +'<div class="match-row">'
      // Seller side
      +'<div class="match-side" style="background:'+cs.b+'12;border:1px solid '+cs.b+'33">'
      +'<div style="font-size:10px;font-weight:800;color:var(--sell);margin-bottom:4px">🏠 بائع</div>'
      +(s.sellerName?'<div style="font-size:13px;font-weight:800;color:#e8f0fe">'+x(s.sellerName)+'</div>':'')
      +(s.direction?'<div style="font-size:11px;color:'+cs.b+';margin-top:2px">'+s.direction+'</div>':'')
      +(s.propertyType?'<div style="font-size:10px;color:var(--muted)">'+s.propertyType+'</div>':'')
      +(s.price?'<div style="font-size:11px;font-weight:900;color:var(--sell);margin-top:3px">'+fp(s.price)+' ﷼</div>':'')
      +'</div>'
      // Arrow
      +'<div class="match-arrow">🤝</div>'
      // Buyer side
      +'<div class="match-side" style="background:'+cb.b+'12;border:1px solid '+cb.b+'33">'
      +'<div style="font-size:10px;font-weight:800;color:var(--buy);margin-bottom:4px">🔑 مشتري</div>'
      +(b.buyerName?'<div style="font-size:13px;font-weight:800;color:#e8f0fe">'+x(b.buyerName)+'</div>':'')
      +(b.direction?'<div style="font-size:11px;color:'+cb.b+';margin-top:2px">'+b.direction+'</div>':'')
      +(b.propertyType?'<div style="font-size:10px;color:var(--muted)">'+b.propertyType+'</div>':'')
      +((b.budgetMin||b.budgetMax)?'<div style="font-size:10px;font-weight:800;color:var(--buy);margin-top:3px">'+(b.budgetMin?fp(b.budgetMin):'—')+' — '+(b.budgetMax?fp(b.budgetMax):'—')+' ﷼</div>':'')
      +'</div>'
      +'</div></div>';
  });
  return h;
}

// ══════════════════════════════════════════
// STATS TAB
// ══════════════════════════════════════════
function renderStats(){
  const ts=sells.length, tb=buys.length, total=ts+tb;
  if(!total) return '<div class="empty"><div class="e-ic">📊</div><div class="e-t">لا توجد بيانات</div></div>';

  const sprices=sells.filter(s=>s.price).map(s=>num(s.price));
  const avgS=sprices.length?Math.round(sprices.reduce((a,b)=>a+b,0)/sprices.length):0;

  let h='<div style="padding-bottom:18px">'
    // Total
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">'
    +'<div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2);border-radius:12px;padding:13px;text-align:center">'
    +'<div style="font-size:28px;font-weight:900;color:var(--sell)">'+ts+'</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-top:2px">عروض البيع</div></div>'
    +'<div style="background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2);border-radius:12px;padding:13px;text-align:center">'
    +'<div style="font-size:28px;font-weight:900;color:var(--buy)">'+tb+'</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-top:2px">طلبات الشراء</div></div>'
    +'<div style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2);border-radius:12px;padding:13px;text-align:center">'
    +'<div style="font-size:28px;font-weight:900;color:var(--match)">'+computeMatches().length+'</div>'
    +'<div style="color:var(--muted);font-size:11px;margin-top:2px">تطابق</div></div>'
    +'</div>';

  // Direction bars (sells + buys)
  h+='<div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px">توزيع الاتجاهات</div>'
    +'<div style="background:var(--surf2);border-radius:12px;overflow:hidden;margin-bottom:12px">';
  DIRS.forEach(d=>{
    const c=DC[d];
    const ns=sells.filter(s=>s.direction===d).length;
    const nb=buys.filter(b=>b.direction===d).length;
    const maxN=Math.max(ns,nb,1);
    h+='<div style="padding:9px 13px;border-bottom:1px solid var(--border)">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
      +'<span class="chip" style="background:'+c.b+';width:38px;text-align:center;font-size:10px">'+d+'</span>'
      +'<span style="color:var(--sell);font-size:11px;font-weight:800">'+ns+' عرض</span>'
      +'<span style="color:var(--dim);font-size:10px">·</span>'
      +'<span style="color:var(--buy);font-size:11px;font-weight:800">'+nb+' طلب</span>'
      +'</div>'
      +'<div style="display:grid;gap:3px">'
      +(ns?'<div style="background:rgba(255,255,255,.05);border-radius:4px;height:6px;overflow:hidden"><div style="width:'+Math.round(ns/maxN*100)+'%;height:100%;background:var(--sell);border-radius:4px"></div></div>':'')
      +(nb?'<div style="background:rgba(255,255,255,.05);border-radius:4px;height:6px;overflow:hidden"><div style="width:'+Math.round(nb/maxN*100)+'%;height:100%;background:var(--buy);border-radius:4px"></div></div>':'')
      +'</div></div>';
  });
  h+='</div>';

  // Type grid
  const byType=TYPES.map(t=>({t,ns:sells.filter(s=>s.propertyType===t).length,nb:buys.filter(b=>b.propertyType===t).length})).filter(z=>z.ns||z.nb);
  if(byType.length){
    h+='<div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px">حسب النوع</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px">';
    byType.forEach(({t,ns,nb})=>{
      h+='<div style="background:var(--surf2);border:1px solid var(--border);border-radius:11px;padding:11px">'
        +'<div style="font-size:14px;font-weight:900;color:var(--text);margin-bottom:5px">'+t+'</div>'
        +'<div style="display:flex;gap:12px">'
        +'<span style="color:var(--sell);font-size:12px;font-weight:800">🏠 '+ns+'</span>'
        +'<span style="color:var(--buy);font-size:12px;font-weight:800">🔑 '+nb+'</span>'
        +'</div></div>';
    });
    h+='</div>';
  }

  // Price stats
  if(sprices.length){
    h+='<div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px">أسعار العروض</div>'
      +'<div style="background:var(--surf2);border-radius:12px;overflow:hidden;margin-bottom:12px">'
      +[['متوسط السعر',fp(avgS)],['أعلى سعر',fp(Math.max(...sprices))],['أقل سعر',fp(Math.min(...sprices))]].map(([k,v])=>'<div class="det-row" style="padding:10px 13px"><span class="det-k">'+k+'</span><span class="det-v" style="color:var(--sell)">'+v+' ﷼</span></div>').join('')+'</div>';
  }

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">'
    +'<button class="btn b-red" onclick="clearKind(\'sell\')">🗑️ مسح العروض</button>'
    +'<button class="btn b-red" onclick="clearKind(\'buy\')">🗑️ مسح الطلبات</button>'
    +'</div></div>';
  return h;
}

      r.propertyType?'🏗️ النوع: '+r.propertyType:'',

      (r.budgetMin||r.budgetMax)?'💰 الميزانية: '+(r.budgetMin?fp(r.budgetMin):'—')+' — '+(r.budgetMax?fp(r.budgetMax):'—')+' ﷼':'',
      r.notes?'📝 '+r.notes:''];

function shareMatch(idx){
  const m=computeMatches()[idx]; if(!m) return;
  const s=m.s, b=m.b;
  const lines=['🤝 تطابق عقاري — درجة التوافق: '+m.score+'%',
    '📌 نقاط التطابق: '+m.matched.join('، '),'',
    '🏠 البائع: '+(s.sellerName||'—')+(s.sellerPhone?' | '+s.sellerPhone:''),
    (s.direction?'   الاتجاه: '+s.direction:'')+(s.propertyType?' | '+s.propertyType:''),
    s.area?'   المساحة: '+s.area+' م²':'',s.price?'   السعر: '+fp(s.price)+' ﷼':'','',
    '🔑 المشتري: '+(b.buyerName||'—')+(b.buyerPhone?' | '+b.buyerPhone:''),
    (b.direction?'   الاتجاه: '+b.direction:'')+(b.propertyType?' | '+b.propertyType:''),
    (b.areaMin||b.areaMax)?'   المساحة: '+(b.areaMin||'—')+'—'+(b.areaMax||'—')+' م²':'',
    (b.budgetMin||b.budgetMax)?'   الميزانية: '+(b.budgetMin?fp(b.budgetMin):'—')+'—'+(b.budgetMax?fp(b.budgetMax):'—')+' ﷼':'',
  ];
  doShare(lines.filter(l=>l.trim()).join('\n'));
  closeOv('mdetOverlay');
}

function doShare(txt){
  if(navigator.share){navigator.share({title:'عقارات',text:txt}).catch(()=>{});}
  else{
    navigator.clipboard.writeText(txt).then(()=>toast('✅ تم النسخ')).catch(()=>{
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('✅ تم النسخ');
    });
  }
}

// ══════════════════════════════════════════
// EDIT / SUBMIT
// ══════════════════════════════════════════
function startEdit(id,kind){
  const r=(kind==='sell'?sells:buys).find(z=>z.id===id); if(!r) return;
  form={...r}; editId=id; mode=kind;
  closeOv('detOverlay'); closeOv('mdetOverlay');
  goTab('add');
}
function sf(field,val){syncDOM();form[field]=val;render();}
function submit(){
  syncDOM();
  if(editId){
    if(mode==='sell') sells=sells.map(r=>r.id===editId?{...form,id:editId}:r);
    else buys=buys.map(r=>r.id===editId?{...form,id:editId}:r);
    toast(mode==='sell'?'✅ تم تعديل العرض':'✅ تم تعديل الطلب');
  } else {
    const rec={...form,id:gid()};
    if(mode==='sell') sells.unshift(rec);
    else buys.unshift(rec);
    const mc=computeMatches();
    const newMatches=mc.filter(m=>(m.s.id===rec.id||m.b.id===rec.id)&&m.score>=50);
    toast(mode==='sell'?'✅ تمت إضافة العرض':'✅ تم تسجيل الطلب');
    if(newMatches.length) setTimeout(()=>toast('🤝 يوجد '+newMatches.length+' تطابق محتمل!','match'),1800);
  }
  form=mode==='sell'?ES():EB(); editId=null; saveAll(); goTab('list');
}
function cancelEdit(){syncDOM();form=mode==='sell'?ES():EB();editId=null;goTab('list');}

// ══════════════════════════════════════════
// DELETE
// ══════════════════════════════════════════
function openDel(id,kind){
  delId=id; delKind=kind;
  document.getElementById('delTitle').textContent=kind==='sell'?'حذف العرض؟':'حذف الطلب؟';
  closeOv('detOverlay');
  document.getElementById('delOverlay').style.display='flex';
}
function confirmDel(){
  if(delKind==='sell') sells=sells.filter(r=>r.id!==delId);
  else buys=buys.filter(r=>r.id!==delId);
  toast('🗑️ تم الحذف','info'); closeOv('delOverlay'); saveAll();
}
function clearKind(kind){
  if(!confirm('⚠️ حذف جميع '+(kind==='sell'?'العروض':'الطلبات')+'؟')) return;
  if(kind==='sell') sells=[]; else buys=[];
  toast('🗑️ تم الحذف','info'); saveAll();
}

// ══════════════════════════════════════════
// IMPORT / EXPORT
// ══════════════════════════════════════════
function exportJSON(){
  const isSell=mode==='sell';
  const fil=filtered();
  if(!fil.length){toast('لا توجد بيانات للتصدير','err');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(fil,null,2)],{type:'application/json;charset=utf-8;'}));
  a.download=(isSell?'عروض_بيع_':'طلبات_شراء_')+new Date().toLocaleDateString('ar-SA').replace(/\//g,'-')+'.json';
  a.click(); toast('📤 تم تصدير '+fil.length+(isSell?' عرض':' طلب'));
}
function openImport(){
  document.getElementById('importLbl').textContent='اضغط لاختيار ملف JSON ('+(mode==='sell'?'عروض':'طلبات')+')';
  document.getElementById('importLbl').style.color=mode==='sell'?'var(--sell)':'var(--buy)';
  document.getElementById('importOverlay').style.display='flex';
}
function doImport(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw 0;
      const target=mode==='sell'?sells:buys;
      const ids=new Set(target.map(r=>r.id));
      let added=0;
      data.forEach(item=>{
        if(typeof item!=='object'||!item) return;
        if(item.id&&ids.has(item.id)) return;
        const newItem={...(mode==='sell'?ES():EB()),...item,id:item.id||gid()};
        target.push(newItem); ids.add(newItem.id); added++;
      });
      if(mode==='sell') sells=[...sells]; else buys=[...buys];
      saveAll(); closeOv('importOverlay');
      toast('✅ تمت إضافة '+added+(mode==='sell'?' عرض':' طلب'));
    } catch(err){toast('❌ ملف غير صالح','err');}
  };
  reader.readAsText(file,'utf-8');
}

function dimBanner(){showBanner=false;localStorage.setItem(IKEY,'1');render();}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function num(v){return isNaN(Number(String(v).replace(/,/g,'')))?0:Number(String(v).replace(/,/g,''));}
function fp(v){const n=Number(String(v).replace(/,/g,''));return isNaN(n)?v:n.toLocaleString('ar-SA');}
function x(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
